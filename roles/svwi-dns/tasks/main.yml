---
# - name: Check that the variable buddyip is set
#   ansible.builtin.fail:
#     msg: "buddyip is not defined or is empty"
#   when: buddyip is not defined or buddyip == ""

- name: Install Docker and Docker Compose inside test container for DinD
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes
  become: yes
  when: ansible_virtualization_type == "docker"

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - mariadb-client
      - git
      - jq
    state: present
    update_cache: false
  become: yes

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_version_check
  failed_when: false
  changed_when: false
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Ensure Docker is installed
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: yes
  become: yes
  when:
    - ansible_virtualization_type != "docker"
    - docker_version_check is defined
    - docker_version_check.rc != 0

# DNS servers don't use Puppet. Remove any leftover puppet apt sources
# so their expired/missing keys don't break apt-get update.
- name: Find puppet apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "puppet*"
  register: puppet_apt_sources
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Remove puppet apt source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ puppet_apt_sources.files }}"
  become: yes
  when:
    - ansible_virtualization_type != "docker"
    - puppet_apt_sources.files | length > 0

- name: Check if system pdns service exists
  ansible.builtin.command: systemctl cat pdns.service
  register: pdns_system_service_check
  failed_when: false
  changed_when: false
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Stop and disable system pdns service
  ansible.builtin.service:
    name: pdns
    state: stopped
    enabled: no
  become: yes
  when:
    - ansible_virtualization_type != "docker"
    - pdns_system_service_check is defined
    - pdns_system_service_check.rc == 0

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: yes

- name: Copy SSH config for Github
  ansible.builtin.copy:
    src: ssh-config
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: '0600'
  become: yes

- name: Ensure SSH key for github deploy exists
  ansible.builtin.copy:
    content: "{{ dnsgithubkey }}"
    dest: /root/.ssh/dns
    owner: root
    group: root
    mode: '0400'
  become: yes
  when: dnsgithubkey != ""

- name: Clone PowerDNS management repo
  ansible.builtin.git:
    repo: "{{ git_repo }}"
    dest: "/opt/svwdns"
    version: HEAD
    accept_hostkey: yes
    key_file: /root/.ssh/dns
    force: yes
  become: yes
  when: dnsgithubkey != ""


- name: Deploy docker-compose override to publish auth port {{ pdns_auth_port }}
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: /opt/svwdns/docker-compose.override.yml
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Write .env file for svwdns
  ansible.builtin.template:
    src: env.j2
    dest: /opt/svwdns/.env
    owner: root
    group: root
    mode: '0640'
  become: yes

- name: Copy database initialization script
  ansible.builtin.copy:
    src: initdb.sql
    dest: /opt/svwdns/initdb.sql
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Create server.cnf with proper mysqld section
  ansible.builtin.copy:
    content: |
      [mysqld]
      server-id = {{ sqlid }}
      log-bin = mysql-bin
      binlog-format = ROW
    dest: /opt/svwdns/server.cnf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Set resolv.conf to Google DNS before stopping systemd-resolved
  ansible.builtin.copy:
    content: "nameserver 8.8.8.8\nnameserver 8.8.4.4\n"
    dest: /etc/resolv.conf
    force: yes
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Stop and disable systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    state: stopped
    enabled: no
  become: yes
  failed_when: false
  when: ansible_virtualization_type != "docker"

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: yes
    state: started
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Copy svw-dns systemd service file
  ansible.builtin.copy:
    src: svw-dns.service
    dest: /etc/systemd/system/svw-dns.service
    owner: root
    group: root
    mode: '0644'
  become: yes
  register: svw_dns_service_file

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes
  when: svw_dns_service_file.changed

- name: Check if MariaDB volume exists
  ansible.builtin.shell: docker volume ls | grep svwdns_mariadb
  register: mariadb_volume_exists
  failed_when: false
  changed_when: false
  become: yes

- name: Fix docker-compose.yml to properly mount initdb.sql
  ansible.builtin.replace:
    path: /opt/svwdns/docker-compose.yml
    regexp: '- \./initdb\.sql:/initdb\.sql'
    replace: '- ./initdb.sql:/docker-entrypoint-initdb.sql'
  become: yes
  register: docker_compose_fixed

- name: Update initdb.sql to use % wildcard instead of CIDR
  ansible.builtin.replace:
    path: /opt/svwdns/initdb.sql
    regexp: "GRANT ALL PRIVILEGES ON \\*\\.\\* TO 'root'@'172\\.6\\.0\\.0/16' IDENTIFIED BY '';"
    replace: "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' IDENTIFIED BY '';"
  become: yes

# --- Port conflict fixes ---
# The Docker recursor and authoritative both tried to bind port 53.
# Fix: remove the Docker recursor (replaced by system pdns-recursor),
# and move the authoritative to port {{ pdns_auth_port }}.

- name: Stop Docker recursor container before removing it from compose
  ansible.builtin.command: docker compose stop {{ pdns_recursor_service }}
  args:
    chdir: /opt/svwdns
  become: yes
  register: docker_recursor_stop
  failed_when: false
  changed_when: "'Stopping' in docker_recursor_stop.stdout"
  when: ansible_virtualization_type != "docker"

- name: Remove Docker recursor service block from docker-compose.yml
  ansible.builtin.replace:
    path: /opt/svwdns/docker-compose.yml
    regexp: '(?m)^  {{ pdns_recursor_service }}:\n(    .*\n)*'
    replace: ''
  become: yes

- name: Check MariaDB root user permissions (if volume exists)
  ansible.builtin.shell: |
    cd /opt/svwdns
    docker compose up -d mariadb
    sleep 10
    SQLPW=$(grep SQLROOTPW .env 2>/dev/null | cut -d= -f2)
    docker compose exec -T mariadb mysql -u root ${SQLPW:+-p"$SQLPW"} \
      -e "SELECT User, Host FROM mysql.user WHERE User='root' AND Host='%';" 2>&1 \
      || echo "PERMISSION_CHECK_FAILED"
  register: mariadb_permission_check
  become: yes
  when: mariadb_volume_exists.rc == 0
  failed_when: false
  changed_when: false

# Only reinit if the MariaDB root user can't connect remotely (permission issue).
# Deliberately exclude docker_compose_fixed.changed - a compose file change
# should NEVER wipe the database and destroy zone data.
- name: Determine if database needs re-initialization
  ansible.builtin.set_fact:
    needs_db_reinit: "{{ mariadb_volume_exists.rc == 0 and (mariadb_permission_check.stdout is search('PERMISSION_CHECK_FAILED') or mariadb_permission_check.stdout is search('ERROR 1130') or mariadb_permission_check.stdout is search('not allowed to connect')) }}"

- name: Stop existing containers if re-initialization needed
  ansible.builtin.shell: |
    cd /opt/svwdns
    docker compose down
  become: yes
  when: needs_db_reinit
  register: containers_stopped

- name: Remove MariaDB volume to force re-initialization
  ansible.builtin.shell: docker volume rm svwdns_mariadb
  become: yes
  when: needs_db_reinit and mariadb_volume_exists.rc == 0
  failed_when: false
  register: volume_removed

- name: Start containers directly with docker-compose after volume removal
  ansible.builtin.shell: |
    cd /opt/svwdns
    docker compose up -d
  become: yes
  when: volume_removed.changed or containers_stopped.changed
  register: containers_started

- name: Wait for containers to be created after direct start
  ansible.builtin.pause:
    seconds: 15
  when: containers_started.changed

- name: Enable PowerDNS systemd service (but don't start - already running)
  ansible.builtin.systemd:
    name: svw-dns
    enabled: yes
    daemon_reload: yes
  become: yes
  when: ansible_virtualization_type != "docker" and not containers_started.changed

- name: Start PowerDNS via systemd (only if containers weren't directly started)
  ansible.builtin.systemd:
    name: svw-dns
    state: started
  become: yes
  when: ansible_virtualization_type != "docker" and not containers_started.changed

- name: Remove orphaned containers (e.g. old Docker recursor)
  ansible.builtin.shell: |
    cd /opt/svwdns
    docker compose up -d --remove-orphans
  become: yes
  register: compose_orphan_cleanup
  changed_when: "'Removed' in compose_orphan_cleanup.stderr or 'Removing' in compose_orphan_cleanup.stderr"
  when: ansible_virtualization_type != "docker"

- name: Wait for MariaDB to initialize
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address }}"
    port: 3306
    delay: 30
    timeout: 300
  when: ansible_virtualization_type != "docker"

- name: Verify MariaDB root user has % wildcard access
  ansible.builtin.shell: |
    docker exec svwdns_mariadb_1 mysql -u root -e "SELECT User, Host FROM mysql.user WHERE User='root' AND Host='%';"
  register: root_wildcard_check
  become: yes
  failed_when: false
  changed_when: false

- name: Display MariaDB user check result
  ansible.builtin.debug:
    msg: "{{ root_wildcard_check.stdout }}"
  when: root_wildcard_check.stdout is defined

# --- System-level pdns-recursor ---
# Handles recursive queries on port 53 and forwards svwi.us to the
# Docker authoritative server on port {{ pdns_auth_port }}.
# Install and start the recursor BEFORE setting resolv.conf to 127.0.0.1
# so that apt can still resolve hostnames during package installation.

- name: Install pdns-recursor
  ansible.builtin.apt:
    name: pdns-recursor
    state: present
    update_cache: no
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Configure pdns-recursor
  ansible.builtin.template:
    src: recursor.conf.j2
    dest: "{{ recursor_conf_path }}"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Restart pdns-recursor
  when: ansible_virtualization_type != "docker"

- name: Enable and start pdns-recursor
  ansible.builtin.service:
    name: pdns-recursor
    state: started
    enabled: yes
  become: yes
  when: ansible_virtualization_type != "docker"

- name: Set /etc/resolv.conf to use local DNS after recursor is running
  ansible.builtin.copy:
    content: "nameserver 127.0.0.1"
    dest: /etc/resolv.conf
    force: yes
  become: yes
  when: ansible_virtualization_type != "docker"


- name: Ensure backup directory exists
  ansible.builtin.file:
    path: /var/backups/powerdns
    state: directory
    owner: root
    group: root
    mode: '0750'
  become: yes

- name: Ensure backup log file exists
  ansible.builtin.file:
    path: /var/log/pdns-backup.log
    state: touch
    owner: root
    group: root
    mode: '0640'
  become: yes

- name: Install backup script
  ansible.builtin.template:
    src: db-backup.sh.j2
    dest: /usr/local/bin/pdns-backup.sh
    owner: root
    group: root
    mode: '0750'
  become: yes

- name: Backup cron job
  ansible.builtin.cron:
    name: "powerdns-backup"
    user: root
    minute: "0"
    hour: "3"
    job: "/usr/local/bin/pdns-backup.sh"
  become: yes

# Certbot DNS certificate update cron
- name: Certbot DNS cert cron job
  ansible.builtin.cron:
    name: "dns-cert"
    user: root
    minute: "0"
    hour: "23"
    job: "cd /opt/svwdns && /usr/bin/docker compose up -d certbot"
  become: yes
