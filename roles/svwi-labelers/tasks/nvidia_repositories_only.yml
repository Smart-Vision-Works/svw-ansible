---
# Minimal APT Repository Setup - CTK only for driver updates
#
# We intentionally do NOT add the NVIDIA CUDA repo (developer.download.nvidia.com)
# here. That repo ships its own versioned driver packages (e.g. 580.159.03-1ubuntu1)
# which conflict with Ubuntu's driver packages (e.g. 580.142-0ubuntu0.24.04.1).
# Ubuntu's repo provides a self-consistent nvidia-driver-580 package set; mixing
# in CUDA repo driver packages causes unresolvable version mismatches.
# The CUDA repo is only needed for CUDA development tools (nvcc, etc.), not for
# running GPU containers.

- name: Remove all existing NVIDIA/CUDA repository files
  ansible.builtin.shell:
    cmd: |
      rm -f /etc/apt/sources.list.d/*nvidia*.list*
      rm -f /etc/apt/sources.list.d/*cuda*.list*
      rm -f /etc/apt/sources.list.d/nvidia-*.list*
      ls -la /etc/apt/sources.list.d/ | grep -i nvidia || echo "All NVIDIA/CUDA repo files removed"
  become: true
  changed_when: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

# NVIDIA Container Toolkit Repository (nvidia.github.io) - needed for nvidia-container-toolkit
- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.shell:
    cmd: curl -fsSL {{ apt_repositories.nvidia_container_toolkit.key_url }} | gpg --batch --yes --no-tty --dearmor -o {{ apt_repositories.nvidia_container_toolkit.key_file }}
  become: true
  changed_when: true

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.apt_repository:
    repo: "{{ apt_repositories.nvidia_container_toolkit.repo }}"
    state: present
    update_cache: false
  become: true

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  failed_when: false

- name: Display APT update result
  ansible.builtin.debug:
    msg: "APT cache updated — using Ubuntu repo for nvidia-driver, CTK repo for nvidia-container-toolkit"

