---
# NFS Mount Setup

# --- Decommissioned mounts ---
# 10.8.7.246 (shared_ro backup NAS) is decommissioned. Tasks are idempotent:
# unmounted is a no-op if already unmounted; lineinfile backrefs only match
# uncommented lines.
- name: Unmount decommissioned shared_ro NAS mount
  ansible.posix.mount:
    path: /auto/shared_ro
    state: unmounted
  become: true

- name: Comment out decommissioned shared_ro NAS entry in /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^(10\.8\.7\.246:/mnt/tank/shared\s+/auto/shared_ro\s+.*)'
    line: '# \1'
    backrefs: true
  become: true

# --- Active mounts ---
- name: Create NFS mount directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ nfs_mounts }}"
  become: true
  when: item.path not in (ansible_mounts | map(attribute='mount') | list)

- name: Configure NFS mounts
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: nfs
    opts: "{{ item.opts }}"
    boot: true
    state: mounted
  loop: "{{ nfs_mounts }}"
  become: true

- name: Copy mount check script
  ansible.builtin.copy:
    src: "{{ labelers_role_files }}/checkMount.sh"
    dest: /usr/local/bin/checkMount.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Add mount check to cron (optional)
  ansible.builtin.cron:
    name: "Check NFS mounts"
    minute: "*/5"
    job: "/usr/local/bin/checkMount.sh"
    user: root
  become: true
  when: false  # Disabled by default, can be enabled if needed
