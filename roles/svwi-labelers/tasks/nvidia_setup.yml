---
# NVIDIA Drivers and CUDA Setup
- name: Check kernel version compatibility
  ansible.builtin.debug:
    msg: "Kernel {{ ansible_kernel }} detected. Driver {{ nvidia_driver_version }} — kernel 6.14+ requires driver 570 or newer."

- name: Fail if kernel/driver mismatch detected
  ansible.builtin.fail:
    msg: "CRITICAL: Kernel {{ ansible_kernel }} requires NVIDIA driver 570 or newer. Current config targets: {{ nvidia_driver_version }}"
  when:
    - ansible_kernel is version('6.14', '>=')
    - nvidia_driver_version | int < 570

- name: Download NVIDIA driver installer (optional/backup)
  ansible.builtin.get_url:
    url: "{{ downloads.nvidia_driver }}"
    dest: /tmp/NVIDIA-Linux-x86_64-530.41.03.run
    mode: '0755'
  become: true
  when: false  # Disabled - using apt packages instead

- name: Force-purge ALL NVIDIA packages (handles broken/unconfigured dpkg states)
  ansible.builtin.shell:
    cmd: |
      # Use dpkg directly to force-remove nvidia packages regardless of broken/iU state
      # Keep full package:arch names (e.g. libnvidia-gl-570:i386) so i386 packages get removed too
      dpkg -l | awk '/nvidia|libnvidia|cuda-drivers/ && /^(ii|iU|rc|iF)/ {print $2}' \
        | sort -u \
        | xargs -r dpkg -P --force-all 2>/dev/null || true
      # Also explicitly purge known conflicting meta-packages by exact name
      for pkg in cuda-drivers-branch nvidia-dkms-kernel; do
        dpkg -P --force-all "$pkg" 2>/dev/null || true
      done
      dpkg --configure -a || true
      DEBIAN_FRONTEND=noninteractive apt --fix-broken install -y || true
      DEBIAN_FRONTEND=noninteractive apt-get autoremove -y || true
      DEBIAN_FRONTEND=noninteractive apt-get autoclean -y || true
  become: true
  changed_when: true
  ignore_errors: true
  register: purge_result

- name: Display purge results
  ansible.builtin.debug:
    msg: "Old NVIDIA packages purged - ready for driver {{ nvidia_driver_version }} installation"

- name: Install NVIDIA driver from Ubuntu repo and container toolkit
  ansible.builtin.apt:
    name:
      - "nvidia-driver-{{ nvidia_driver_version }}"
      - "nvidia-container-toolkit"
    state: present
    update_cache: false
    allow_unauthenticated: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true
  notify: restart docker
  register: nvidia_install

- name: Load nvidia kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - nvidia
    - nvidia_uvm
    - nvidia_drm
    - nvidia_modeset
  become: true
  ignore_errors: true  # May fail if driver just installed

- name: Check if Docker daemon.json exists
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: docker_daemon_json

- name: Backup existing Docker daemon.json
  ansible.builtin.copy:
    src: /etc/docker/daemon.json
    dest: /etc/docker/daemon.json.backup-{{ ansible_date_time.epoch }}
    remote_src: true
    mode: '0644'
  become: true
  when: docker_daemon_json.stat.exists

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure Docker daemon base settings
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/svwi-labelers/files/docker-daemon.json"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart docker

- name: Enable nvidia-modprobe service (creates /dev/nvidia* device files at boot)
  ansible.builtin.systemd:
    name: nvidia-modprobe
    enabled: true
    daemon_reload: true
  become: true
  ignore_errors: true

- name: Run nvidia-modprobe to create device files now
  ansible.builtin.command:
    cmd: nvidia-modprobe -u
  become: true
  ignore_errors: true
  changed_when: true

- name: Create nvidia-persistenced systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Override nvidia-persistenced to run as root (avoids privilege-drop permission issues)
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/nvidia-persistenced --verbose
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reload systemd

- name: Enable and start nvidia-persistenced
  ansible.builtin.systemd:
    name: nvidia-persistenced
    state: started
    enabled: true
    daemon_reload: true
  become: true
  ignore_errors: true

- name: Configure Docker to use NVIDIA Container Runtime with nvidia-ctk
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
  become: true
  notify: restart docker
  register: nvidia_ctk_config
  changed_when: nvidia_ctk_config.rc == 0

- name: Verify nvidia-smi is working
  ansible.builtin.command:
    cmd: nvidia-smi
  become: true
  register: nvidia_smi_check
  changed_when: false
  failed_when: false

- name: Display nvidia-smi status
  ansible.builtin.debug:
    msg: "nvidia-smi {{ 'is working' if nvidia_smi_check.rc == 0 else 'failed - may need reboot' }}"

- name: Check if Zabbix agent directory exists
  ansible.builtin.stat:
    path: /etc/zabbix/zabbix_agentd.d
  register: zabbix_dir
  become: true

- name: Copy Zabbix NVIDIA monitoring parameters (if Zabbix is installed)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/svwi-labelers/files/userparameter_nvidia-smi.conf.linux"
    dest: /etc/zabbix/zabbix_agentd.d/userparameter_nvidia-smi.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  when: zabbix_dir.stat.exists
