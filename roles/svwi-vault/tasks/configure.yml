---
- name: Render vault.hcl config
  ansible.builtin.template:
    src: config.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: root
    group: vault
    mode: '0640'
  notify: Restart Vault

- name: Render vault.env
  ansible.builtin.template:
    src: vault.env.j2
    dest: /etc/vault.d/vault.env
    owner: vault
    group: vault
    mode: '0600'
  notify: Restart Vault

- name: Place wildcard TLS certificate
  ansible.builtin.copy:
    content: "{{ vault.starsvwiuscert }}"
    dest: /etc/vault.d/fullchain.pem
    owner: root
    group: ssl-cert
    mode: '0640'
  when: "'starsvwiuscert' in vault and vault.starsvwiuscert | length > 0"
  notify: Restart Vault

- name: Place wildcard TLS private key
  ansible.builtin.copy:
    content: "{{ vault.starsvwiuskey }}"
    dest: /etc/vault.d/privkey.pem
    owner: root
    group: ssl-cert
    mode: '0640'
  when: "'starsvwiuskey' in vault and vault.starsvwiuskey | length > 0"
  notify: Restart Vault

- name: Ensure snapshots token file exists
  ansible.builtin.file:
    path: /etc/vault.d/snapshots.token
    state: touch
    owner: vault
    group: hashicorp
    mode: '0640'
    modification_time: preserve
    access_time: preserve

- name: Render snapshot script
  ansible.builtin.template:
    src: take-snapshot.sh.j2
    dest: /etc/vault.d/take-snapshot.sh
    owner: vault
    group: vault
    mode: '0700'

- name: Schedule daily vault snapshot at 06:00
  ansible.builtin.cron:
    name: vault-snapshot
    user: vault
    minute: "0"
    hour: "6"
    job: "cd /home/vault && bash /etc/vault.d/take-snapshot.sh >> /home/vault/snapshot.log 2>&1"
    state: present
