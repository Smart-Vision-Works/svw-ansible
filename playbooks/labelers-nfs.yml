---
- name: Setup NFS Mounts on Labeler Machines
  hosts: labeler-machines
  become: true
  vars:
    # Provides the role files path to nfs_setup.yml since include_tasks does
    # not set role_path the way include_role does.
    labelers_role_files: "{{ playbook_dir }}/../roles/svwi-labelers/files"

  tasks:
    - name: Load svwi-labelers defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/svwi-labelers/defaults/main.yml"

    - name: Setup NFS mounts
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../roles/svwi-labelers/tasks/nfs_setup.yml"

    - name: Verify NFS mounts are active
      ansible.builtin.shell:
        cmd: df -h | grep /auto/
      register: mount_check
      changed_when: false
      failed_when: false

    - name: Display mounted filesystems
      ansible.builtin.debug:
        msg: "{{ mount_check.stdout_lines }}"
      when: mount_check.stdout_lines | length > 0
